package com.cassie.guard
import android.content.*
import android.provider.Telephony
import android.telephony.SmsManager
import com.google.android.gms.location.LocationServices

class SmsBlockReceiver : BroadcastReceiver() {
    override fun onReceive(context: Context, intent: Intent) {
        if (intent.action != Telephony.Sms.Intents.SMS_RECEIVED_ACTION) return
        val prefs = context.getSharedPreferences("cassie_prefs", Context.MODE_PRIVATE)
        val secretPin = prefs.getString("secret_pin", "2026") ?: "2026"
        val messages = Telephony.Sms.Intents.getMessagesFromIntent(intent)
        for (sms in messages) {
            val body = sms.messageBody.trim()
            val sender = sms.originatingAddress ?: continue
            if (!body.contains(secretPin)) continue
            if (body.startsWith("BLOCK")) {
                Helper.lockPhone(context)
                Helper.sendLocationToFirestore(context)
            } else if (body.startsWith("LOC")) {
                try {
                    val fused = LocationServices.getFusedLocationProviderClient(context)
                    fused.lastLocation.addOnSuccessListener { loc ->
                        if (loc != null) {
                            val link = "https://www.google.com/maps?q=${loc.latitude},${loc.longitude}"
                            SmsManager.getDefault().sendTextMessage(sender, null, "Cassie Guard Location: $link", null, null)
                            Helper.sendLocationToFirestore(context)
                        }
                    }
                } catch (e: Exception) {}
            }
        }
    }
}
