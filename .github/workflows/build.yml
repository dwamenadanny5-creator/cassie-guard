package com.cassie.guard

import android.app.*
import android.bluetooth.*
import android.bluetooth.le.*
import android.content.*
import android.os.*
import androidx.core.app.NotificationCompat
import com.google.firebase.auth.FirebaseAuth
import com.google.firebase.firestore.FirebaseFirestore
import java.util.*

/**
 * Cassie Network - Offline Crowd Finding
 * How it works:
 * 1. Lost phone (no SIM, no WiFi) advertises BLE beacon: "CASSIE_LOST_{deviceId}"
 * 2. Any other phone with Cassie Guard installed scans for beacons
 * 3. Finder phone gets its own location (GPS) + sees lost phone nearby via BLE
 * 4. Finder phone anonymously uploads: "I saw lost device X near lat/lng"
 * 5. Owner sees location on dashboard even though lost phone has no internet
 * 
 * This is how Google Find My Device network and Apple AirTag work - using other phones as relays
 */
class CrowdFinderService : Service() {
    private lateinit var bluetoothManager: BluetoothManager
    private var bleAdvertiser: BluetoothLeAdvertiser? = null
    private var bleScanner: BluetoothLeScanner? = null
    private var isLostMode = false

    private val handler = Handler(Looper.getMainLooper())
    
    // Advertise as lost device
    private fun startAdvertisingAsLost() {
        try {
            val uid = FirebaseAuth.getInstance().currentUser?.uid ?: return
            // Short ID for BLE (BLE has 29 byte limit)
            val shortId = uid.take(6) 
            val settings = AdvertiseSettings.Builder()
                .setAdvertiseMode(AdvertiseSettings.ADVERTISE_MODE_LOW_POWER)
                .setTxPowerLevel(AdvertiseSettings.ADVERTISE_TX_POWER_LOW)
                .setConnectable(false)
                .build()
            
            val data = AdvertiseData.Builder()
                .setIncludeDeviceName(false)
                .addServiceUuid(ParcelUuid(UUID.fromString("0000CASS-0000-1000-8000-00805F9B34FB")))
                .addServiceData(ParcelUuid(UUID.fromString("0000CASS-0000-1000-8000-00805F9B34FB")), "CASSIE_$shortId".toByteArray())
                .build()
            
            bleAdvertiser?.startAdvertising(settings, data, advertiseCallback)
        } catch (e: Exception) {}
    }

    private val advertiseCallback = object : AdvertiseCallback() {
        override fun onStartSuccess(settingsInEffect: AdvertiseSettings?) {}
        override fun onStartFailure(errorCode: Int) {}
    }

    // Scan for other lost Cassie devices (acting as helper)
    private fun startScanningForLostDevices() {
        try {
            val filter = ScanFilter.Builder()
                .setServiceUuid(ParcelUuid(UUID.fromString("0000CASS-0000-1000-8000-00805F9B34FB")))
                .build()
            val settings = ScanSettings.Builder()
                .setScanMode(ScanSettings.SCAN_MODE_LOW_POWER)
                .build()
            bleScanner?.startScan(listOf(filter), settings, scanCallback)
        } catch (e: Exception) {}
    }

    private val scanCallback = object : ScanCallback() {
        override fun onScanResult(callbackType: Int, result: ScanResult) {
            try {
                val data = result.scanRecord?.getServiceData(ParcelUuid(UUID.fromString("0000CASS-0000-1000-8000-00805F9B34FB"))) ?: return
                val beaconId = String(data)
                if (!beaconId.startsWith("CASSIE_")) return
                
                val lostUidShort = beaconId.removePrefix("CASSIE_")
                // I found a lost phone! Report my location as its approximate location
                reportFoundDevice(lostUidShort, result.rssi)
            } catch (e: Exception) {}
        }
    }

    private fun reportFoundDevice(lostUidShort: String, rssi: Int) {
        // Get my own location (I am the finder phone, I have internet/GPS)
        try {
            val myLoc = com.google.android.gms.location.LocationServices.getFusedLocationProviderClient(this).lastLocation
            myLoc.addOnSuccessListener { loc ->
                if (loc == null) return@addOnSuccessListener
                // Anonymously report: found device near me
                // We can't know full UID from short, so we search Firestore for matching short and report via cloud function would be ideal
                // For MVP: store in global crowd_reports collection
                val report = mapOf(
                    "found_short_id" to lostUidShort,
                    "finder_lat" to loc.latitude,
                    "finder_lng" to loc.longitude,
                    "finder_accuracy" to loc.accuracy,
                    "rssi" to rssi,
                    "time" to System.currentTimeMillis(),
                    "is_crowd_report" to true
                )
                FirebaseFirestore.getInstance().collection("cassie_crowd_reports").add(report)
                
                // Also try to update the actual lost device if we can find its full UID via query (requires index)
                // Simplified: owner will check crowd_reports for their short ID
            }
        } catch (e: Exception) {}
    }

    override fun onCreate() {
        super.onCreate()
        bluetoothManager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
        bleAdvertiser = bluetoothManager.adapter?.bluetoothLeAdvertiser
        bleScanner = bluetoothManager.adapter?.bluetoothLeScanner

        val prefs = getSharedPreferences("cassie_prefs", Context.MODE_PRIVATE)
        
        val channel = NotificationChannel("cassie_crowd", "Cassie Network", NotificationManager.IMPORTANCE_LOW)
        (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
        val notif = NotificationCompat.Builder(this, "cassie_crowd")
            .setContentTitle("Cassie Network Active")
            .setContentText("Helping find other lost phones offline")
            .setSmallIcon(android.R.drawable.ic_lock_lock)
            .build()
        startForeground(2, notif)

        // Decide if I'm lost or helper
        handler.post(object : Runnable {
            override fun run() {
                val simState = Helper.getSimState(this@CrowdFinderService)
                val isSimRemoved = simState == "REMOVED"
                val isLocked = prefs.getBoolean("sim_removed_locked", false) || prefs.getBoolean("is_locked", false)
                
                if (isSimRemoved || isLocked) {
                    // I'm the LOST phone - advertise
                    isLostMode = true
                    startAdvertisingAsLost()
                } else {
                    // I'm a HELPER phone - scan for others
                    isLostMode = false
                    startScanningForLostDevices()
                }
                handler.postDelayed(this, 10*60*1000L) // re-check every 10 min
            }
        })
    }

    override fun onBind(intent: Intent?): IBinder? = null
    override fun onDestroy() {
        try {
            bleAdvertiser?.stopAdvertising(advertiseCallback)
            bleScanner?.stopScan(scanCallback)
        } catch (e: Exception) {}
        super.onDestroy()
    }
}
