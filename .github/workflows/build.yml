import android.app.admin.DevicePolicyManager
import android.content.*
import com.google.android.gms.location.LocationServices
import com.google.firebase.auth.FirebaseAuth
import com.google.firebase.firestore.FirebaseFirestore

object Helper {
    fun getUserDoc(): String {
        val uid = FirebaseAuth.getInstance().currentUser?.uid ?: "anon"
        return uid
    }
    fun lockPhone(context: Context) {
        val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
        val admin = ComponentName(context, MyDeviceAdmin::class.java)
        if (dpm.isAdminActive(admin)) dpm.lockNow()
    }
    fun sendLocationToFirestore(context: Context) {
        try {
            val fused = LocationServices.getFusedLocationProviderClient(context)
            fused.lastLocation.addOnSuccessListener { loc ->
                if (loc != null) {
                    val uid = getUserDoc()
                    val link = "https://www.google.com/maps?q=${loc.latitude},${loc.longitude}"
                    val data = mapOf(
                        "lat" to loc.latitude,
                        "lng" to loc.longitude,
                        "link" to link,
                        "time" to System.currentTimeMillis(),
                        "accuracy" to loc.accuracy,
                        "deviceModel" to android.os.Build.MODEL
                    )
                    FirebaseFirestore.getInstance().collection("cassie_users").document(uid).collection("devices").document("primary").set(data)
                    // also global last location
                    FirebaseFirestore.getInstance().collection("cassie_users").document(uid).set(mapOf("lastSeen" to System.currentTimeMillis()), com.google.firebase.firestore.SetOptions.merge())
                }
            }
        } catch (e: Exception) {}
    }
}
