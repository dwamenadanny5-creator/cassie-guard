package com.cassie.guard
import android.app.admin.DeviceAdminReceiver
import android.content.Context
import android.content.Intent
import android.widget.Toast

class MyDeviceAdmin : DeviceAdminReceiver() {
    // Prevent uninstall - when user tries to deactivate admin
    override fun onDisableRequested(context: Context, intent: Intent): CharSequence {
        // Show warning and require PIN
        val prefs = context.getSharedPreferences("cassie_prefs", Context.MODE_PRIVATE)
        val pin = prefs.getString("secret_pin", "2026")
        // This message shows when someone tries to disable admin
        return "⚠️ Cassie Guard Protection! Enter PIN $pin in app to disable. Phone will lock if you proceed without PIN. This prevents thieves from flashing."
    }

    override fun onDisabled(context: Context, intent: Intent) {
        // If admin disabled without PIN, immediately lock and send location
        try {
            Helper.lockPhone(context)
            Helper.sendLocationToFirestore(context, isSimRemoved = true)
        } catch (e: Exception) {}
    }

    override fun onEnabled(context: Context, intent: Intent) {
        super.onEnabled(context, intent)
        // When enabled, block factory reset and make persistent
        try {
            val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as android.app.admin.DevicePolicyManager
            val admin = android.content.ComponentName(context, MyDeviceAdmin::class.java)
            
            // ANTI-FLASH: Block factory reset from settings (works on Device Owner)
            dpm.addUserRestriction(admin, android.os.UserManager.DISALLOW_FACTORY_RESET)
            dpm.addUserRestriction(admin, android.os.UserManager.DISALLOW_SAFE_BOOT)
            dpm.addUserRestriction(admin, android.os.UserManager.DISALLOW_ADD_USER)
            dpm.addUserRestriction(admin, android.os.UserManager.DISALLOW_CONFIG_CREDENTIALS)
            
            // Make app persistent - restarts if killed (for flashing tools that kill apps)
            dpm.setApplicationHidden(admin, "com.cassie.guard", false)
        } catch (e: Exception) {}
    }
}
