package com.cassie.guard
import android.content.*
import android.widget.Toast

class SimRemovalReceiver : BroadcastReceiver() {
    override fun onReceive(context: Context, intent: Intent) {
        val action = intent.action
        // Detect SIM removed or airplane mode tricks
        if (action == "android.intent.action.SIM_STATE_CHANGED" || 
            action == Intent.ACTION_AIRPLANE_MODE_CHANGED ||
            action == "android.intent.action.PHONE_STATE") {
            
            val simState = Helper.getSimState(context)
            val prefs = context.getSharedPreferences("cassie_prefs", Context.MODE_PRIVATE)
            val wasSimReady = prefs.getBoolean("was_sim_ready", false)
            
            if (simState == "REMOVED" && wasSimReady) {
                // THIEF REMOVED SIM - IMMEDIATE ACTION
                Helper.lockPhone(context) // Lock instantly, don't wait 6h
                Helper.sendLocationToFirestore(context, isSimRemoved = true)
                
                // Try to enable WiFi to upload location via satellite/GPS + WiFi
                try {
                    val wifiManager = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as android.net.wifi.WifiManager
                    if (!wifiManager.isWifiEnabled) wifiManager.isWifiEnabled = true
                } catch (e: Exception) {}
                
                // Save flag
                prefs.edit().putBoolean("sim_removed_locked", true).apply()
            }
            
            // Update sim status
            prefs.edit().putBoolean("was_sim_ready", simState == "READY").apply()
        }
    }
}
