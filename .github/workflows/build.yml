package com.cassie.guard
import android.app.admin.DevicePolicyManager
import android.bluetooth.BluetoothManager
import android.content.*
import android.os.Bundle
import android.widget.*
import androidx.appcompat.app.AppCompatActivity
import com.google.firebase.auth.FirebaseAuth

class MainActivity : AppCompatActivity() {
    private lateinit var prefs: SharedPreferences
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)
        prefs = getSharedPreferences("cassie_prefs", MODE_PRIVATE)
        val etNumber = findViewById<EditText>(R.id.trustedNumber)
        val etPin = findViewById<EditText>(R.id.secretPin)
        val etBtName = findViewById<EditText>(R.id.trustedBtName)
        val tvUser = findViewById<TextView>(R.id.tvUser)
        val status = findViewById<TextView>(R.id.status)
        val btList = findViewById<TextView>(R.id.btList)
        tvUser.text = "Logged as: ${FirebaseAuth.getInstance().currentUser?.uid?.take(8)}... (Global ID)"
        etNumber.setText(prefs.getString("trusted_number", ""))
        etPin.setText(prefs.getString("secret_pin", "2026"))
        etBtName.setText(prefs.getString("trusted_bt_name", ""))
        val btManager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
        val paired = btManager.adapter?.bondedDevices?.map { "${it.name}" } ?: emptyList()
        btList.text = "Your paired devices (pick one as OWNER key):\n" + paired.joinToString("\n")

        findViewById<Button>(R.id.btnAdmin).setOnClickListener {
            val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
            val admin = ComponentName(this, MyDeviceAdmin::class.java)
            if (!dpm.isAdminActive(admin)) {
                startActivity(Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN).apply {
                    putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, admin)
                    putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "Cassie Guard needs to lock phone when not with owner")
                })
            }
        }
        findViewById<Button>(R.id.btnStart).setOnClickListener {
            prefs.edit().putString("trusted_number", etNumber.text.toString())
                .putString("secret_pin", etPin.text.toString())
                .putString("trusted_bt_name", etBtName.text.toString())
                .putLong("last_touch", System.currentTimeMillis())
                .apply()
            AntiFlashManager.enableAntiFlash(this)
            startForegroundService(Intent(this, AutoLockService::class.java))
            try { startService(Intent(this, CrowdFinderService::class.java)) } catch (e: Exception) {}
            status.text = "ACTIVE Global Anti-Flash: Factory reset BLOCKED, FRP enabled, IMEI registered. Will lock if away from ${etBtName.text} for 6h. SMS: BLOCK#${etPin.text} / LOC#${etPin.text}"
        }
    }
}
