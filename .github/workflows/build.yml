package com.cassie.guard
import android.app.*
import android.bluetooth.*
import android.content.*
import android.os.*
import androidx.core.app.NotificationCompat
import com.google.firebase.firestore.FirebaseFirestore
import com.google.firebase.auth.FirebaseAuth

class AutoLockService : Service() {
    private val SIX_HOURS = 6 * 60 * 60 * 1000L
    private lateinit var prefs: SharedPreferences
    private val handler = Handler(Looper.getMainLooper())
    private var bluetoothDisconnectedSince: Long? = null

    private val checker = object : Runnable {
        override fun run() {
            val now = System.currentTimeMillis()
            val isWithOwner = isOwnerNearby()
            if (isWithOwner) {
                bluetoothDisconnectedSince = null
                prefs.edit().putLong("last_owner_seen", now).apply()
            } else {
                if (bluetoothDisconnectedSince == null) bluetoothDisconnectedSince = now
                val awayFor = now - (bluetoothDisconnectedSince ?: now)
                if (awayFor >= SIX_HOURS) {
                    Helper.lockPhone(this@AutoLockService)
                    Helper.sendLocationToFirestore(this@AutoLockService)
                    bluetoothDisconnectedSince = now
                }
            }
            handler.postDelayed(this, 5*60*1000L)
        }
    }

    private fun isOwnerNearby(): Boolean {
        val trustedName = prefs.getString("trusted_bt_name", "") ?: ""
        if (trustedName.isEmpty()) {
            // fallback to touch
            val last = prefs.getLong("last_touch", System.currentTimeMillis())
            return System.currentTimeMillis() - last < SIX_HOURS
        }
        val bluetoothManager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
        val connected = bluetoothManager.getConnectedDevices(BluetoothProfile.GATT) + 
                        bluetoothManager.getConnectedDevices(BluetoothProfile.A2DP) +
                        bluetoothManager.getConnectedDevices(BluetoothProfile.HEADSET)
        return connected.any { it.name.contains(trustedName, ignoreCase = true) }
    }

    private val userActivityReceiver = object : BroadcastReceiver() {
        override fun onReceive(c: Context?, i: Intent?) {
            prefs.edit().putLong("last_touch", System.currentTimeMillis()).apply()
        }
    }

    override fun onCreate() {
        super.onCreate()
        prefs = getSharedPreferences("cassie_prefs", MODE_PRIVATE)
        registerReceiver(userActivityReceiver, IntentFilter().apply {
            addAction(Intent.ACTION_SCREEN_ON)
            addAction(Intent.ACTION_USER_PRESENT)
        })
        val channel = NotificationChannel("cassie", "Cassie Guard", NotificationManager.IMPORTANCE_LOW)
        (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
        val notif = NotificationCompat.Builder(this, "cassie")
            .setContentTitle("Cassie Guard Global Active")
            .setContentText("Protecting - auto-lock if not with you 6h")
            .setSmallIcon(android.R.drawable.ic_lock_lock)
            .build()
        startForeground(1, notif)
        handler.post(checker)
        // Start Cassie Network offline finding
        try { startService(Intent(this, CrowdFinderService::class.java)) } catch (e: Exception) {}
        // Listen to global commands for this user
        val uid = FirebaseAuth.getInstance().currentUser?.uid ?: return
        FirebaseFirestore.getInstance().collection("cassie_users").document(uid).collection("devices").document("primary")
            .addSnapshotListener { snap, _ ->
                val cmd = snap?.getString("command") ?: return@addSnapshotListener
                if (cmd == "LOCK") {
                    Helper.lockPhone(this)
                    Helper.sendLocationToFirestore(this)
                    snap.reference.update("command", "DONE")
                } else if (cmd == "LOC") {
                    Helper.sendLocationToFirestore(this)
                    snap.reference.update("command", "DONE")
                }
            }
    }
    override fun onBind(i: Intent?): IBinder? = null
}
