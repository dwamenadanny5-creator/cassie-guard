package com.cassie.guard

import android.app.admin.DevicePolicyManager
import android.content.ComponentName
import android.content.Context
import android.os.UserManager

/**
 * ANTI-FLASH PROTECTION - Makes Cassie Guard survive and make phone useless after flash
 * 
 * LEVELS:
 * 1. Device Admin: Prevents uninstall from settings without PIN
 * 2. Device Owner (via ADB): Blocks factory reset button in settings, blocks safe mode
 * 3. System App (root): Survives factory reset, only full ROM flash removes it
 * 4. Google FRP (Factory Reset Protection): After flash, phone asks for original Google account - thief can't use it
 * 5. Cassie Cloud Lock: Even after flash, IMEI is flagged in our server, next time any Cassie Guard sees it, reports location
 * 
 * No app can survive SP Flash Tool / Odin full ROM flash (that's hardware level). 
 * But we can make phone USELESS after flash so thief gains nothing.
 */
object AntiFlashManager {
    
    fun enableAntiFlash(context: Context) {
        try {
            val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
            val admin = ComponentName(context, MyDeviceAdmin::class.java)
            
            if (!dpm.isAdminActive(admin)) return
            
            // Check if we are Device Owner (highest protection)
            if (dpm.isDeviceOwnerApp(context.packageName)) {
                // BLOCK FACTORY RESET - thief can't reset from settings to flash
                dpm.addUserRestriction(admin, UserManager.DISALLOW_FACTORY_RESET)
                dpm.addUserRestriction(admin, UserManager.DISALLOW_SAFE_BOOT) // Block safe mode (used to bypass)
                dpm.addUserRestriction(admin, UserManager.DISALLOW_FACTORY_RESET)
                dpm.addUserRestriction(admin, UserManager.DISALLOW_ADD_USER)
                dpm.addUserRestriction(admin, UserManager.DISALLOW_CONFIG_CREDENTIALS)
                dpm.addUserRestriction(admin, UserManager.DISALLOW_DEBUGGING_FEATURES) // Block USB debugging to prevent flash via ADB
                
                // Lock task mode - make Cassie Guard persistent
                dpm.setLockTaskPackages(admin, arrayOf(context.packageName))
                
                // Set as persistent preferred activity - restarts on boot even after reset attempt
                // dpm.addPersistentPreferredActivity...
            } else {
                // Even as normal Device Admin, try to block
                try {
                    dpm.addUserRestriction(admin, UserManager.DISALLOW_FACTORY_RESET)
                } catch (e: Exception) {}
            }
            
            // Enable Google FRP - ensure Google account is required after flash
            // This is automatic if you have Google account logged in and Find My Device enabled
            // We remind user to enable it
            
            // Register IMEI to Cassie Cloud - if phone flashed and reinstalled with new account, we detect same IMEI
            registerImeiToCloud(context)
            
        } catch (e: Exception) {}
    }
    
    private fun registerImeiToCloud(context: Context) {
        try {
            val prefs = context.getSharedPreferences("cassie_prefs", Context.MODE_PRIVATE)
            // Get unique hardware IDs that survive flash
            val androidId = android.provider.Settings.Secure.getString(context.contentResolver, android.provider.Settings.Secure.ANDROID_ID)
            val serial = try { android.os.Build.getSerial() } catch (e: Exception) { android.os.Build.SERIAL }
            
            val data = mapOf(
                "android_id" to androidId,
                "serial" to serial,
                "model" to android.os.Build.MODEL,
                "brand" to android.os.Build.BRAND,
                "time" to System.currentTimeMillis(),
                "is_protected" to true
            )
            val uid = com.google.firebase.auth.FirebaseAuth.getInstance().currentUser?.uid ?: return
            com.google.firebase.firestore.FirebaseFirestore.getInstance()
                .collection("cassie_users").document(uid)
                .collection("hardware_ids").document(androidId ?: "unknown").set(data)
            
            // Also global blacklist of stolen IMEIs
            com.google.firebase.firestore.FirebaseFirestore.getInstance()
                .collection("cassie_global_blacklist").document(androidId ?: "unknown")
                .set(mapOf("owner_uid" to uid, "is_stolen" to false, "model" to android.os.Build.MODEL))
                
        } catch (e: Exception) {}
    }
    
    fun isDeviceOwner(context: Context): Boolean {
        val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
        return dpm.isDeviceOwnerApp(context.packageName)
    }
}
